requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2.0.54",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
]
